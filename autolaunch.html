<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .loader {
      position: absolute;
      color: #38bdf8;
      font-size: 1.3rem;
      font-weight: 600;
      animation: fade 1.5s infinite ease-in-out;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      z-index: 10;
    }

    @keyframes fade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader">Launching your cloaked site...</div>

  <!-- 👇 CHANGE THIS LINE to whatever should appear inside your cloaked tab -->
  <!-- If you want the new UI, use "index.html". If you want an external site, put that URL instead -->
  <iframe id="cloak" src="index.html"></iframe>

  <script>
    const loader = document.querySelector(".loader");
    const frame = document.getElementById("cloak");

    frame.addEventListener("load", () => {
      loader.style.display = "none";
    });
  </script>
</body>
</html>
