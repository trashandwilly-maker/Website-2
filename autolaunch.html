<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autolaunch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-direction: column;
      color: #38bdf8;
      font-weight: 600;
      font-size: 1.3rem;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #60a5fa;
    }
  </style>
</head>
<body>
  <div>Click below to launch your cloaked site:</div>
  <button id="launchBtn">Launch</button>

  <script>
    document.getElementById('launchBtn').addEventListener('click', () => {
      const win = window.open('about:blank', '_blank');

      // Inject cloaked HTML
      const html = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Cloaked Site</title>
          <style>
            html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
            iframe { width: 100%; height: 100%; border: none; }
          </style>
        </head>
        <body>
          <iframe src="https://Wackymah.xyz"></iframe>
        </body>
        </html>
      `;

      win.document.write(html);
      win.document.close();

      // Optional: hide current page content
      document.body.innerHTML = '<div>Site launched! You can close this tab.</div>';
    });
  </script>
</body>
</html>
