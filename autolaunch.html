<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autolaunch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .loader {
      color: #38bdf8;
      font-size: 1.3rem;
      font-weight: 600;
      animation: fade 1.5s infinite ease-in-out;
    }
    @keyframes fade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader">Launching your cloaked site...</div>

  <script>
    // Open about:blank window
    const win = window.open('about:blank', '_blank');

    // Inject your cloaked HTML
    const html = `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cloaked Site</title>
        <style>
          html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
          iframe { width: 100%; height: 100%; border: none; }
        </style>
      </head>
      <body>
        <iframe src="https://Wackymah.xyz"></iframe>
      </body>
      </html>
    `;

    win.document.write(html);
    win.document.close();

    // Hide loader on current page (optional)
    document.querySelector(".loader").style.display = "none";
  </script>
</body>
</html>
