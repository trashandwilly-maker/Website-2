<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPIC WEBSITE</title>
  <link rel="icon" href="schoology.ico" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px #3b82f6;
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #3b82f6; }
      to { text-shadow: 0 0 30px #60a5fa; }
    }

    p {
      max-width: 700px;
      font-size: 1rem;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 0 15px rgba(59,130,246,0.4);
      margin: 5px;
    }

    button:hover {
      background: #60a5fa;
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(96,165,250,0.7);
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
      width: 90%;
      max-width: 1000px;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    input {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-top: 0.8rem;
      width: 250px;
    }
  </style>
</head>
<body>
  <h1>EPIC WEBSITE</h1>

  <p>Welcome! Use the buttons below to open various gaming websites in a cloaked tab (about:blank).</p>

  <!-- Gaming buttons section -->
  <div class="links">
    <button onclick="openCloak('https://coolmathgames.com')">Cool Math Games</button>
    <button onclick="openCloak('https://poki.com')">Poki</button>
    <button onclick="openCloak('https://kongregate.com')">Kongregate</button>
    <button onclick="openCloak('https://armorgames.com')">Armor Games</button>
    <button onclick="openCloak('https://miniclip.com')">Miniclip</button>
    <button onclick="openCloak('https://addictinggames.com')">Addicting Games</button>
    <button onclick="openCloak('https://nitrome.com')">Nitrome</button>
    <button onclick="openCloak('https://y8.com')">Y8 Games</button>
    <button onclick="openCloak('https://games.lol')">Games.lol</button>
    <button onclick="openCloak('https://crazygames.com')">Crazy Games</button>
    <button onclick="openCloak('https://pokemongame.com')">Pokemon Game</button>
    <button onclick="openCloak('https://neopets.com')">Neopets</button>
    <button onclick="openCloak('https://roblox.com')">Roblox</button>
    <button onclick="openCloak('https://scratch.mit.edu')">Scratch</button>
    <button onclick="openCloak('https://habbo.com')">Habbo</button>
    <button onclick="openCloak('https://miniworlds.com')">Mini Worlds</button>
    <button onclick="openCloak('https://slither.io')">Slither.io</button>
    <button onclick="openCloak('https://agar.io')">Agar.io</button>
    <button onclick="openCloak('https://slopegame.com')">Slope</button>
    <button onclick="openCloak('https://2048game.com')">2048</button>
  </div>

  <!-- Optional custom link input -->
  <div style="margin-top:2rem;">
    <input type="text" id="customlinkbox" placeholder="Enter custom link (e.g. https://example.com)">
    <button onclick="openCustom()">Open Custom Link</button>
  </div>

  <footer>Made with ❤️ by your dev team</footer>

  <script>
    function openCloak(url) {
      const win = window.open('about:blank', '_blank');
      const html = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Cloaked Game</title>
          <style>
            html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
            iframe { width: 100%; height: 100%; border: none; }
          </style>
        </head>
        <body>
          <iframe src="${url}"></iframe>
        </body>
        </html>
      `;
      win.document.write(html);
      win.document.close();
    }

    function openCustom() {
      const url = document.getElementById('customlinkbox').value;
      if (url) openCloak(url);
    }
  </script>
</body>
</html>
